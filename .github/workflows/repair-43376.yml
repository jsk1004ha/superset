name: Verify PR 43376 repairs

on:
  push:
    branches: [codex/ci-repair-43376-20261014]

permissions:
  contents: write
  actions: read

jobs:
  repair:
    if: github.repository == 'jsk1004ha/superset'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/ci-repair-43376-20261014
          fetch-depth: 2
      - name: Confirm generated OpenAPI
        run: test "$(git hash-object docs/static/resources/openapi.json)" = f6f48b2af1f89667b81d7def59ae39cb05715579
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: apache/superset
          run-id: 38532746400
          name: docker-image
          github-token: ${{ github.token }}
          path: /tmp/ci-image
      - name: Load original frontend CI image
        run: zstd -d < /tmp/ci-image/docker-image.tar.zst | docker load
      - name: Apply candidate changes and order test helpers
        run: |
          git cat-file -e 0559d711959405cc1a2f67fc74b9b35b9cfca034 || git fetch --depth=1 origin 0559d711959405cc1a2f67fc74b9b35b9cfca034
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import subprocess
          source = subprocess.check_output([
              'git', 'show',
              '0559d711959405cc1a2f67fc74b9b35b9cfca034:.github/workflows/repair-43376.yml',
          ], text=True)
          script = source.split("          python - <<'PY'\n", 1)[1].split('          PY\n', 1)[0]
          exec(compile(dedent(script), '<reviewed-candidate-patch>', 'exec'))
          p = Path('superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx')
          s = p.read_text()
          start = s.index('async function chooseDependentOption(')
          end = s.index('async function openDependentSchemaForm(', start)
          helper = s[start:end]
          s = s[:start] + s[end:]
          assert s.count('beforeEach(() => {') == 1
          s = s.replace('beforeEach(() => {', helper + 'beforeEach(() => {', 1)
          old = "  expect(refreshCounts.get(JSON.stringify([['m1'], null]))).toBeGreaterThanOrEqual(1);\n  expect(refreshCounts.get(JSON.stringify([['m1', 'm2'], null]))).toBeGreaterThanOrEqual(1);"
          new = "  const attemptedMetrics = [...refreshCounts.keys()].map(snapshot => JSON.parse(snapshot)[0]);\n  expect(attemptedMetrics).toEqual(expect.arrayContaining([['m1'], ['m1', 'm2']]));"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Format and lint candidates
        run: |
          docker run --rm -e CI=true \
            -v "$PWD/superset-frontend/src/features/semanticViews/AddSemanticViewModal.tsx:/app/superset-frontend/src/features/semanticViews/AddSemanticViewModal.tsx" \
            -v "$PWD/superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx:/app/superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx" \
            apache/superset:GHA-38532746400 bash -c \
            'npx oxfmt --write src/features/semanticViews/AddSemanticViewModal.tsx src/features/semanticViews/AddSemanticViewModal.test.tsx && npx oxlint --config oxlint.json src/features/semanticViews/AddSemanticViewModal.tsx src/features/semanticViews/AddSemanticViewModal.test.tsx'
      - name: Save candidates on isolated branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add superset-frontend/src/features/semanticViews/AddSemanticViewModal.tsx superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix(semantic): clean up modal work and stabilize retry coverage'
            git push origin HEAD:codex/ci-repair-43376-20261014
          fi
          git ls-tree HEAD docs/static/resources/openapi.json superset-frontend/src/features/semanticViews/AddSemanticViewModal.tsx superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx
      - name: Verify target suites and repeat semantic-view tests
        run: |
          docker run --rm -e CI=true -e NODE_ENV=test -e NODE_OPTIONS=--max-old-space-size=8192 \
            -v "$PWD/superset-frontend/src/features/semanticViews/AddSemanticViewModal.tsx:/app/superset-frontend/src/features/semanticViews/AddSemanticViewModal.tsx:ro" \
            -v "$PWD/superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx:/app/superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx:ro" \
            apache/superset:GHA-38532746400 bash -c \
            'npx jest --runInBand --silent --runTestsByPath src/features/semanticViews/AddSemanticViewModal.test.tsx src/explore/components/controls/ViewQueryModal.test.tsx src/dashboard/components/SliceHeaderControls/SliceHeaderControls.test.tsx && npx jest --runInBand --silent --runTestsByPath src/features/semanticViews/AddSemanticViewModal.test.tsx && npx jest --runInBand --silent --runTestsByPath src/features/semanticViews/AddSemanticViewModal.test.tsx'
      - name: Build workspace declarations and type-check
        run: |
          docker run --rm -e CI=true \
            -v "$PWD/superset-frontend/src/features/semanticViews/AddSemanticViewModal.tsx:/app/superset-frontend/src/features/semanticViews/AddSemanticViewModal.tsx:ro" \
            -v "$PWD/superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx:/app/superset-frontend/src/features/semanticViews/AddSemanticViewModal.test.tsx:ro" \
            apache/superset:GHA-38532746400 bash -c \
            'npm i && npm run plugins:build && npm run type'
